name: CI

on:
  push:
    branches: ["**"]
  pull_request:


  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --fix || true

      - name: Test
        run: pytest -v -m "not integration"
        env:
          GEMINI_API_KEY: "mock_api_key_for_testing" #trick the test with a mock api key